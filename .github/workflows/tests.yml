name: Tests

on:
  push:
  pull_request:

# The default GITHUB_TOKEN inherits whatever the repository setting allows; this job only
# reads the checkout, so say so explicitly.
permissions:
  contents: read

# A superseded push has no value once a newer one is running.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    # Pinned rather than `ubuntu-latest`: the 26.04 image no longer ships a Python 3.8
    # build, and 3.8 is the floor this project promises. 22.04 carries every version
    # below and stays supported.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the supported range plus the two releases most users actually run.
        python-version: ["3.8", "3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m py_compile src/*.py hbnscan.py hbnscan_gui.py packaging/build.py
      - run: python -m ruff check .
      - run: python -m coverage run -m unittest discover -s tests -v
      - run: python -m coverage report -m
      # The browser app ships a generated folder; building it catches a page that
      # references a module the bundle no longer contains.
      - run: python packaging/build.py wasm
      - run: python packaging/build.py deb
      - name: Desktop GUI smoke test
        run: |
          if command -v xvfb-run >/dev/null 2>&1; then
            xvfb-run -a python tests/gui_smoke.py
          else
            echo "xvfb-run is unavailable; skipping the desktop smoke test"
          fi

  # The image is how the self-hosted audience runs this, so it is built on every push: that
  # keeps the Dockerfile honest without publishing anything.
  container:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t hb-briefing:test .
      - name: Start it and ask it for state
        run: |
          docker run -d --name hb-smoke -p 8765:8765 hb-briefing:test
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/api/state -o /tmp/state.json; then break; fi
            sleep 2
          done
          test -s /tmp/state.json
          grep -q '"product": "HB Briefing' /tmp/state.json
          grep -q '"mode": "offline"' /tmp/state.json
      - name: Seeding and state survive a restart
        run: |
          docker exec hb-smoke python3 /app/hbnscan.py --seed-feeds
          docker exec hb-smoke test -s /data/feeds.txt
          docker restart hb-smoke >/dev/null
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/api/state > /dev/null; then break; fi
            sleep 2
          done
          docker exec hb-smoke test -s /data/watchdog_state.db
      - name: Entrypoint modes
        run: |
          docker run --rm hb-briefing:test help | grep -q "HB Briefing container"
          docker run --rm hb-briefing:test nonsense || test $? -eq 2
          docker run --rm hb-briefing:test shell -c true
      - name: Logs on failure
        if: failure()
        run: docker logs hb-smoke || true
