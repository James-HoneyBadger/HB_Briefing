[tool.ruff]
# Keep the lint surface focused on real errors: undefined names, unused imports, and
# obviously broken syntax. Style churn is not worth failing a build over here.
target-version = "py38"
line-length = 100
extend-exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
branch = false
source = ["hbnscan", "hbworkspace", "hbnweb", "hbntui"]

[tool.coverage.report]
skip_empty = true
exclude_lines = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
